openapi: 3.0.3
info:
  title: Shortlink Microservice API
  description: A microservice for creating and expanding short URLs
  version: 1.0.0
  contact:
    name: API Support
    email: support@shortlink.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/v1
    description: Local development server

paths:
  /shorten:
    post:
      tags:
        - Shortlink
      summary: Create a short URL
      description: Creates a shortened version of the provided original URL
      operationId: createShortUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShortUrlRequest'
      responses:
        '201':
          description: Short URL created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShortUrlResponse'
        '400':
          description: Bad request - Invalid URL format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidUrl:
                  summary: Invalid URL format
                  value:
                    error: "INVALID_URL"
                    message: "The provided URL is not valid"
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  summary: Internal server error
                  value:
                    error: "INTERNAL_ERROR"
                    message: "An unexpected error occurred"
                    timestamp: "2024-01-15T10:30:00Z"

  /expand/{shortCode}:
    get:
      tags:
        - Shortlink
      summary: Expand a short URL
      description: Retrieves the original URL from the provided short code
      operationId: expandShortUrl
      parameters:
        - name: shortCode
          in: path
          required: true
          description: The short code part of the shortened URL (e.g., 'abc123' from 'https://short.ly/abc123')
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]+$'
            minLength: 1
            maxLength: 20
          examples:
            validCode:
              summary: Valid short code
              value: "abc123"
            anotherCode:
              summary: Another valid code
              value: "xyz789"
      responses:
        '200':
          description: Original URL retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpandShortUrlResponse'
              examples:
                example1:
                  summary: Successful expansion
                  value:
                    originalUrl: "https://www.example.com/very/long/url/with/many/parameters?param1=value1&param2=value2"
        '404':
          description: Short URL not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Short URL not found
                  value:
                    error: "SHORT_URL_NOT_FOUND"
                    message: "The provided short code does not exist"
                    timestamp: "2024-01-15T10:30:00Z"
        '400':
          description: Bad request - Invalid short code format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCode:
                  summary: Invalid short code
                  value:
                    error: "INVALID_SHORT_CODE"
                    message: "The provided short code format is invalid"
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateShortUrlRequest:
      type: object
      required:
        - originalUrl
      properties:
        originalUrl:
          type: string
          format: uri
          description: The original URL to be shortened
          example: "https://www.example.com/very/long/url/with/many/parameters"
          minLength: 1
          maxLength: 2048
          pattern: '^https?://.+'
      description: Request payload for creating a short URL

    CreateShortUrlResponse:
      type: object
      required:
        - shortUrl
      properties:
        shortUrl:
          type: string
          format: uri
          description: The generated short URL
          example: "https://short.ly/abc123"
          minLength: 1
          maxLength: 255
      description: Response payload containing the created short URL

    ExpandShortUrlResponse:
      type: object
      required:
        - originalUrl
      properties:
        originalUrl:
          type: string
          format: uri
          description: The original URL corresponding to the short code
          example: "https://www.example.com/very/long/url/with/many/parameters"
          minLength: 1
          maxLength: 2048
      description: Response payload containing the expanded original URL

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
          description: Error code identifying the type of error
          example: "INVALID_URL"
          enum:
            - "INVALID_URL"
            - "SHORT_URL_NOT_FOUND"
            - "INVALID_SHORT_CODE"
            - "INTERNAL_ERROR"
            - "RATE_LIMIT_EXCEEDED"
        message:
          type: string
          description: Human-readable error message
          example: "The provided URL is not valid"
          minLength: 1
          maxLength: 500
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the error occurred
          example: "2024-01-15T10:30:00Z"
        details:
          type: object
          description: Additional error details (optional)
          additionalProperties: true
          example:
            field: "originalUrl"
            rejectedValue: "invalid-url"
      description: Standard error response format

tags:
  - name: Shortlink
    description: Operations for creating and expanding short URLs